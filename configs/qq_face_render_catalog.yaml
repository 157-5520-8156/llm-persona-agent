# Inbound QQ face render catalog.
#
# This is a reviewed table of platform catalog labels: what a OneBot/QQ face
# identifier renders as in the client picker. It is NOT a mood, intent, or
# "usually means..." translation, and it is NOT the outbound sticker allowlist
# (`QQ_STICKER_OPTIONS` in expression_payload_contract.py).
#
# Lookup rule: unknown IDs must be left unmatched. Do not guess or substitute
# a nearby name.
#
# Sources (retrieved 2026-08-18):
# - qq-bot-openapi:
#   https://bot.q.qq.com/wiki/develop/api-v2/openapi/emoji/model.html
#   Official QQ Bot emoji list. The table column is labelled 表情含义; overlapping
#   rows are used as catalog names. When the official name disagrees with the
#   QQ client QDes, the client render name wins (id 181: official 骚扰, client 戳一戳).
# - napcat-face-config:
#   https://raw.githubusercontent.com/NapNeko/NapCatQQ/main/packages/napcat-core/external/face_config.json
#   QQ client sysface table shipped with NapCat, the production OneBot stack.
#   QSid is the OneBot `face.id`; QDes is the client slash-command / picker name
#   (leading "/" stripped).
# - qface-qqnt:
#   https://koishi.js.org/QFace/assets/qq_emoji/_index.json
#   QQ NT `face_config.json` extract. Numeric ids corroborate NapCat with zero
#   name disagreements.
#
# Glyphs: unicode from the official type-2 list, plus a short reviewed object
# set for system faces whose catalog name *is* the object (太阳, 月亮, 玫瑰, ...).
# Facial-expression names do not get a guessed mood glyph.


